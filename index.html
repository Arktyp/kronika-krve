<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kronika krve</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Cormorant+Garamond:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: kartotéka — tenké linky, kapitálkové nadpisy, tečky a políčka jako na papírovém V5 listu; jediný akcent je krev (hlad, kostky). */
:root{
  --bg:#ece8e7; --surface:#f8f6f5; --sunk:#e2dcdb; --ink:#1e1517; --ink-2:#4a3d40; --muted:#75686b; --line:#d3caca;
  --blood:#8c1c27; --blood-soft:#f1dcdd; --ok:#2f6b4a; --warn:#9a6312;
  --f-display:"Cormorant Garamond","Iowan Old Style","Palatino Linotype",Georgia,serif;
  --f-body:"IBM Plex Sans","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]):not([data-theme="parchment"]){
  --bg:#0a0708; --surface:#151012; --sunk:#050304; --ink:#f0e4e2; --ink-2:#cbb7b5; --muted:#937f81; --line:#33201f;
  --blood:#d72638; --blood-soft:#3d0f17; --ok:#67b98a; --warn:#d8a043; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0a0708; --surface:#151012; --sunk:#050304; --ink:#f0e4e2; --ink-2:#cbb7b5; --muted:#937f81; --line:#33201f;
  --blood:#d72638; --blood-soft:#3d0f17; --ok:#67b98a; --warn:#d8a043; color-scheme:dark}
:root[data-theme="night"]{
  --bg:#0c0f17; --surface:#141927; --sunk:#080a10; --ink:#e7e9f2; --ink-2:#b9bed2; --muted:#7f87a3; --line:#262d40;
  --blood:#c9476a; --blood-soft:#341827; --ok:#6cbfa0; --warn:#d6a85a; color-scheme:dark}
:root[data-theme="parchment"]{
  --bg:#e8dcc5; --surface:#f4ecdb; --sunk:#dccdb2; --ink:#2a1c12; --ink-2:#4f3b2b; --muted:#7c6751; --line:#cbb898;
  --blood:#7c1420; --blood-soft:#ecd2c6; --ok:#3f6b3c; --warn:#94600f; color-scheme:light}
:root[data-theme="dark"] body{background:radial-gradient(ellipse 120% 60% at 50% -10%,#2a0a10 0%,#0a0708 60%) fixed}
@media (prefers-color-scheme:dark){:root:not([data-theme]) body{background:radial-gradient(ellipse 120% 60% at 50% -10%,#2a0a10 0%,#0a0708 60%) fixed}}
:root[data-theme="night"] body{background:radial-gradient(ellipse 120% 60% at 50% -10%,#1b2140 0%,#0c0f17 60%) fixed}
:root[data-theme="parchment"] body{background:radial-gradient(ellipse 110% 70% at 50% 0%,#f1e6cf 0%,#e2d3b6 70%) fixed}
.themesel{display:flex;align-items:center;gap:6px;font-size:.78rem;color:var(--muted)}.themesel select{width:auto;padding:3px 6px;font-size:.78rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;color:var(--ink)}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--f-body);font-size:15px;line-height:1.5;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 64px}
*{box-sizing:border-box}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:1120px;margin:0 auto}
h1,h2,h3{font-family:var(--f-display);font-weight:600;text-wrap:balance;margin:0;line-height:1.15}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blood);outline-offset:2px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* pojmy: anglicky, pod tím česky; popis v bublině */
.term{display:inline-flex;flex-direction:column;line-height:1.15;vertical-align:middle;min-width:0}
.term .cz,.termi .cz{font-family:var(--f-body);font-size:.72rem;font-weight:400;color:var(--muted);text-transform:none;letter-spacing:0}
h2 .term .cz,h3 .term .cz{font-size:.8rem;margin-top:2px}
.label .term .cz{font-size:.68rem}
[data-tip]{cursor:help}
.term[data-tip] .en,.termi[data-tip]{text-decoration:underline dotted var(--muted);text-decoration-thickness:1px;text-underline-offset:3px}
.term:focus,.termi:focus{outline:none}
.term:focus-visible .en{outline:2px solid var(--blood);outline-offset:1px}
#tip{position:fixed;z-index:40;max-width:min(330px,calc(100vw - 24px));background:var(--ink);color:var(--bg);padding:8px 11px;border-radius:5px;font-size:.8rem;line-height:1.45;white-space:pre-line;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.25)}

/* header */
.top{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap;padding-top:22px;padding-bottom:12px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.brand h1{font-size:2rem;letter-spacing:.01em}
.brand .who{color:var(--muted);font-size:.9rem;overflow-wrap:anywhere}
.status{font-size:.78rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.status i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.status.cloud i{background:var(--ok)} .status.local i{background:var(--warn)} .status.busy i{background:var(--blood)}
nav.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);display:flex;gap:2px;overflow-x:auto;border-bottom:1px solid var(--line);margin-bottom:22px;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 12px;font-size:.85rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);cursor:pointer;white-space:nowrap;border-bottom:2px solid transparent;margin-bottom:-1px}
nav.tabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--blood);font-weight:600}
nav.tabs button.wizt{color:var(--blood)}

/* sections */
.sec{margin-bottom:34px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap;border-bottom:1px solid var(--ink-2);padding-bottom:6px;margin-bottom:14px}
.sec-h h2{font-size:1.55rem}
.sec-h .hint{font-size:.8rem;color:var(--muted)}
.label{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(240px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
input[type=text],input[type=number],input:not([type]),select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:4px;padding:7px 9px;min-width:0}
textarea{min-height:80px;resize:vertical}
input[type=number]{font-family:var(--f-mono)}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.inline>*{min-width:0}
.grow{flex:1 1 160px}
.btn{background:var(--surface);border:1px solid var(--ink-2);border-radius:4px;padding:7px 12px;cursor:pointer;font-size:.88rem;white-space:nowrap}
.btn:hover{background:var(--sunk)}
.btn.pri{background:var(--blood);border-color:var(--blood);color:#fff}
.btn.pri:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{color:var(--blood);background:none}
.btn.sm{padding:4px 9px;font-size:.8rem}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chip{display:inline-block;font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;padding:2px 6px;border-radius:3px;border:1px solid var(--line);color:var(--muted);font-weight:600;white-space:nowrap}
.chip.v5{border-color:var(--ink-2);color:var(--ink-2)} .chip.v20{border-color:var(--warn);color:var(--warn)} .chip.hb{border-color:var(--blood);color:var(--blood)}
.chip.clan{background:var(--blood-soft);border-color:var(--blood);color:var(--blood)}
.chip.k-merit{color:var(--ok);border-color:var(--ok)} .chip.k-flaw{color:var(--blood);border-color:var(--blood)} .chip.k-background{color:var(--ink-2);border-color:var(--ink-2)}
.muted{color:var(--muted)} .small{font-size:.82rem}
.note{font-size:.85rem;color:var(--ink-2);background:var(--sunk);border-radius:4px;padding:10px 12px}
.note b{color:var(--ink)}

/* dots & boxes */
.dots{display:inline-flex;align-items:center;flex-wrap:wrap}
.dot{width:24px;height:26px;border:0;background:none;padding:0;cursor:pointer;display:inline-grid;place-items:center}
.dot::after{content:"";width:13px;height:13px;border-radius:50%;border:1.5px solid var(--ink-2);transition:background .12s}
.dot.on::after{background:var(--ink);border-color:var(--ink)}
.dot:hover:not(:disabled)::after{border-color:var(--blood)}
.dot:disabled{cursor:default}
.dot:disabled::after{border-style:dotted;opacity:.45}
.dot.on:disabled::after{opacity:1;border-style:solid}
.dots.sq .dot::after{border-radius:2px}
.dots.gap5 .dot:nth-child(5n){margin-right:6px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:38px}
.trait-col{display:flex;flex-direction:column}
.trait-col .row{border-bottom:1px dotted var(--line)}
.skill{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 8px;align-items:center;padding:4px 0;border-bottom:1px dotted var(--line)}
.skill input{grid-column:1/-1;font-size:.78rem;padding:3px 7px;background:transparent;border-color:transparent}
.skill input:focus,.skill input:not(:placeholder-shown){border-color:var(--line);background:var(--surface)}
.boxes{display:flex;flex-wrap:wrap;gap:5px}
.box{width:28px;height:28px;border:1.5px solid var(--ink-2);border-radius:3px;background:var(--surface);padding:0;cursor:pointer}
.box.sup{background:linear-gradient(135deg,transparent 45%,var(--ink) 45% 55%,transparent 55%),var(--surface)}
.box.agg{background:linear-gradient(135deg,transparent 45%,var(--blood) 45% 55%,transparent 55%),linear-gradient(45deg,transparent 45%,var(--blood) 45% 55%,transparent 55%),var(--surface)}
.box.on{background:var(--ink);border-color:var(--ink)}
.box.hun{border-color:var(--blood)} .box.hun.on{background:var(--blood);border-color:var(--blood)}
.box.stain{background:repeating-linear-gradient(45deg,var(--blood-soft) 0 4px,var(--surface) 4px 8px);border-color:var(--blood)}
.box.stain.on{background:repeating-linear-gradient(45deg,var(--blood) 0 3px,var(--ink) 3px 7px)}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:14px}
.card-h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.list{display:flex;flex-direction:column;gap:12px}
.tr.items{display:grid;gap:8px;align-items:center;grid-template-columns:minmax(0,1.4fr) minmax(90px,.7fr) 64px 64px minmax(0,2fr) auto;padding:6px 0;border-bottom:1px dotted var(--line)}
.tr.items.ih{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted,#888);padding-bottom:0;border-bottom:0}
@media (max-width:700px){.tr.items{grid-template-columns:1fr 1fr 1fr;}.tr.items.ih{display:none}}
.locked-in{background:transparent!important;border-style:dashed!important;cursor:default}
.powers{display:grid;gap:4px 16px;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));margin-top:6px}
.pw{display:flex;gap:8px;align-items:flex-start;font-size:.88rem;padding:3px 0}
.pw input{margin-top:4px;accent-color:var(--blood)}
.pw.locked{opacity:.5}
.pw .req{display:block}
.lvl{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);min-width:1.4em}
.ddesc{font-size:.84rem;color:var(--ink-2);margin:-4px 0 8px}
.dinfo{background:var(--sunk);border-radius:5px;padding:10px 12px;font-size:.82rem;color:var(--ink-2);display:flex;flex-direction:column;gap:6px;margin:0 0 10px}
.dinfo.compact{padding:7px 9px;font-size:.74rem;gap:3px;margin:4px 0 0;background:transparent;border-top:1px dotted var(--line);border-radius:0}
.dmeta{display:flex;gap:4px 14px;flex-wrap:wrap}
.dinfo b{color:var(--ink);font-weight:600}
.dnote{font-size:.74rem;color:var(--warn)}
.dinfo details summary{cursor:pointer;color:var(--ink);font-weight:500}
.dinfo details p{margin-top:6px}
.buybar{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:2px solid var(--blood);box-shadow:0 -6px 20px rgba(0,0,0,.18);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px calc(12px + env(safe-area-inset-bottom,0px))}
.buybar .inner{max-width:1120px;margin:0 auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.buybar .bmsg{flex:1 1 280px;font-size:.9rem}
.xpnote{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}
.xpnote.lock{border-left:3px solid var(--blood)}
.specro{grid-column:1/-1;display:flex;gap:6px;align-items:center;flex-wrap:wrap;font-size:.78rem;color:var(--ink-2)}
.resbox{display:flex;flex-direction:column;gap:4px}
.resbox b{color:var(--ink)}
table.bpt{border-collapse:collapse;font-family:var(--f-mono);font-size:.74rem;width:100%;min-width:420px}
table.bpt th,table.bpt td{padding:3px 6px;border-bottom:1px dotted var(--line);text-align:left}
table.bpt th{color:var(--muted);font-weight:600}
table.bpt tr.cur td{background:var(--blood-soft);color:var(--blood);font-weight:600}
.pline{display:block;font-size:.72rem;color:var(--muted);font-family:var(--f-mono);line-height:1.35}
.pmeta{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}

/* advantages */
.adv{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:4px 10px;align-items:center;padding:8px 0;border-bottom:1px dotted var(--line)}
.adv .nm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;min-width:0}
.adv .gain{grid-column:1/-1;font-size:.8rem;color:var(--ink-2)}
.adv .note-in{grid-column:1/-1}
.adv .note-in input{font-size:.82rem;padding:4px 8px}
.adv.locked .nm::after{content:"z predátora";font-size:.66rem;text-transform:uppercase;letter-spacing:.06em;color:var(--blood);font-weight:600}
.picker{border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:12px;display:flex;flex-direction:column;gap:10px}
.plist{max-height:420px;overflow:auto;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.pgrp{font-size:.7rem;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;padding:10px 4px 4px}
.pitem{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;text-align:left;border:0;border-bottom:1px dotted var(--line);background:none;padding:8px 6px;cursor:pointer;align-items:start}
.pitem:hover:not(:disabled){background:var(--blood-soft)}
.pitem:disabled{cursor:not-allowed;opacity:.5}
.pitem .pn{font-weight:600}
.pitem .pn .cz{font-weight:400;color:var(--muted);font-size:.78rem;margin-left:6px}
.pitem .pd{grid-column:1/-1;font-size:.78rem;color:var(--muted)}
.pitem .pw2{font-size:.76rem;color:var(--blood);grid-column:1/-1}
.pitem .pw2.ok{color:var(--ok)}
.adv .rel{grid-column:1/-1;font-size:.78rem;color:var(--ok)}
.adv.replaced{opacity:.5}
.adv.replaced .nm::after{content:"nahrazeno"}
.adv .acts2{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap}

/* chars */
.cards{display:grid;gap:14px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:8px;cursor:pointer}
.pc.cur{border-color:var(--blood);box-shadow:inset 3px 0 0 var(--blood)}
.pc h3{font-size:1.45rem;overflow-wrap:anywhere}
.pc .meta{font-size:.82rem;color:var(--muted)}
.pc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
.empty{border:1px dashed var(--line);border-radius:6px;padding:28px;text-align:center;color:var(--muted)}

/* play */
.play{display:grid;gap:26px;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr)}
@media (max-width:860px){.play{grid-template-columns:1fr}}
.trk{padding:12px 0;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:8px}
.trk-h{display:flex;justify-content:space-between;align-items:flex-end;gap:8px;flex-wrap:wrap}
.trk-h h3{font-size:1.25rem}
.big{font-family:var(--f-mono);font-size:.9rem}
.warnline{font-size:.8rem;color:var(--blood);font-weight:600}
.roller{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:16px;display:flex;flex-direction:column;gap:12px}
.poolsum{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.poolsum .n{font-family:var(--f-display);font-size:2.6rem;line-height:1;font-weight:700}
.dice{display:flex;flex-wrap:wrap;gap:6px}
/* kostky ve stylu VtM: desetistěnka, černé normální, červené hladové, symboly místo čísel */
.dice{gap:8px}
.die{width:46px;height:50px;border:0;background:none;padding:0;position:relative;color:#efe6d8;filter:drop-shadow(0 0 .7px var(--ink-2)) drop-shadow(0 2px 2px rgba(0,0,0,.28))}
.die .face{position:absolute;inset:0;clip-path:polygon(50% 0,100% 37%,83% 100%,17% 100%,0 37%);background:linear-gradient(160deg,#2a2224 0%,#0f0b0c 70%);display:grid;place-items:center}
.die.hunger .face{background:linear-gradient(160deg,#c42a38 0%,#7c111d 75%)}
.die.hunger{color:#140a0b}
.die svg{width:25px;height:25px;margin-top:9px;display:block}
.die .num{position:absolute;left:0;right:0;bottom:3px;text-align:center;font-family:var(--f-mono);font-size:.56rem;opacity:.6;pointer-events:none}
.die.fail{opacity:.82}
.die.pick{cursor:pointer}
.die.sel{opacity:1;filter:drop-shadow(0 0 2px var(--warn)) drop-shadow(0 0 3px var(--warn))}
.die.rr::before{content:"↻";position:absolute;top:-4px;right:-2px;z-index:2;font-size:.7rem;color:var(--warn);font-weight:700}
.dlegend{display:flex;gap:4px 14px;flex-wrap:wrap;font-size:.74rem;color:var(--muted);align-items:center}
.dlegend span{display:inline-flex;gap:4px;align-items:center}
.dlegend .mini{width:18px;height:20px;position:relative;display:inline-block;filter:drop-shadow(0 0 .5px var(--ink-2))}
.dlegend .mini .face{position:absolute;inset:0;clip-path:polygon(50% 0,100% 37%,83% 100%,17% 100%,0 37%);background:#140f10;display:grid;place-items:center;color:#efe6d8}
.dlegend .mini.h .face{background:#a3202d;color:#140a0b}
.dlegend .mini svg{width:11px;height:11px;margin-top:4px}
@keyframes roll{from{transform:rotate(-25deg) scale(.6);opacity:0}to{transform:none;opacity:1}}
.dice.fresh .die{animation:roll .28s ease-out both}
.dice.fresh .die:nth-child(2n){animation-delay:.04s}.dice.fresh .die:nth-child(3n){animation-delay:.08s}
@media (prefers-reduced-motion:reduce){.dice.fresh .die{animation:none}}
.verdict{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.vd{font-size:.78rem;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:3px 8px;border-radius:3px;border:1px solid currentColor}
.vd.good{color:var(--ok)} .vd.bad{color:var(--muted)} .vd.blood{color:var(--blood);background:var(--blood-soft)} .vd.warn{color:var(--warn)}
.result-n{font-family:var(--f-display);font-size:1.9rem;font-weight:700;line-height:1}
.hist{display:flex;flex-direction:column}
.hist .h{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line);font-size:.85rem;align-items:baseline}
.hist .h .t{color:var(--muted);font-family:var(--f-mono);font-size:.75rem}

/* xp */
.xpsum{display:flex;gap:28px;flex-wrap:wrap}
.xpsum>div{display:flex;flex-direction:column}
.xpsum .v{font-family:var(--f-display);font-size:2.4rem;font-weight:700;line-height:1}
.xpsum .v.av{color:var(--blood)}
.log .h{display:grid;grid-template-columns:90px 64px minmax(0,1fr) auto;gap:10px;padding:6px 0;border-bottom:1px dotted var(--line);font-size:.88rem;align-items:center}
.plus{color:var(--ok)} .minus{color:var(--blood)}
.jr{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:1px solid var(--line)}

/* library */

function upgradeLib(lib){
  if(lib&&lib.v>=LIBV)return false;
  const oldD=Object.fromEntries((lib.disciplines||[]).map(d=>[lc(d.name),d]));
  const fresh=seedLib(),seeds={disciplines:SEED_DISC,clans:SEED_CLANS,merits:SEED_MERITS,predators:SEED_PRED,items:SEED_ITEMS};
  for(const cat in seeds){const names=new Set(seeds[cat].map(x=>x.name.toLowerCase()));
    const keep=(lib[cat]||[]).filter(x=>x&&x.name&&!names.has(x.name.toLowerCase())&&(cat==="items"||x.source==="Homebrew"||!["V5","V20"].includes(x.source)));
    keep.forEach(x=>{if(cat==="merits"){x.dots=x.dots&&Array.isArray(x.dots)?x.dots:R(1,5);x.excl=x.excl||[];x.lv=x.lv||{};x.group=x.group||"Vlastní"}if(cat==="clans"&&!x.bane?.n)x.bane={n:typeof x.bane==="string"?x.bane:"",t:""};if(cat==="predators"){x.disc=x.disc||[];x.specs=x.specs||[];x.gain=x.gain||[];x.hum=x.hum||0;x.bp=x.bp||0}});
    fresh[cat]=fresh[cat].concat(keep);}
  fresh.disciplines.forEach(d=>{const o=oldD[lc(d.name)];if(o&&Array.isArray(o.rituals))o.rituals.filter(r=>r&&r.name&&!(d.rituals||[]).some(x=>lc(x.name)===lc(r.name))).forEach(r=>(d.rituals=d.rituals||[]).push(r));if(o&&Array.isArray(o.powers))o.powers.filter(p=>p&&p.name&&!p.seed&&!(p.src==="Homebrew"&&OLD_HB.includes(p.name))&&!d.powers.some(x=>lc(x.name)===lc(p.name))).forEach(p=>d.powers.push(p))});
  Object.keys(lib).forEach(k=>delete lib[k]);Object.assign(lib,fresh);return true;
}

async function initCloud(){
  if(!window.claude||!window.claude.use){setStatus("local","Uloženo v tomto prohlížeči");return}
  try{
    const [db,user]=await Promise.all([claude.use("db"),claude.use("user")]);
    const id=user?await user.id():null;
    if(!db||!id){cloudNote="Uloženo jen v tomto prohlížeči";setStatus("local",cloudNote);return}
    const col=db.collection("data/users/"+id);
    const snap=await col.get();
    const remote={};snap.docs.forEach(d=>{if(d.exists)remote[d.id]=d.data()});
    let changed=false;
    for(const k in remote){const r=remote[k];let obj;try{obj=JSON.parse(r.json)}catch(e){continue}
      const lt=S.stamps[k]||0;
      if((r.updated||0)>lt||(k.startsWith("c_")&&!S.chars[k.slice(2)]&&!S.synced[k])){
        if(k==="lib")S.lib=obj;else if(k==="npcs")S.npcs=Array.isArray(obj)?obj:[];else if(k.startsWith("c_")){S.chars[obj.id]=obj;if(!S.order.includes(obj.id))S.order.push(obj.id)}
        S.stamps[k]=r.updated||Date.now();S.synced[k]=true;changed=true;
      }else if((r.updated||0)<lt)dirty.add(k);else S.synced[k]=true}
    if(snap.docs.some(d=>d.id.startsWith("c_")))for(const cid of [...S.order]){const c=S.chars[cid];if(c&&c.example&&!S.synced["c_"+cid]&&!remote["c_"+cid]){delete S.chars[cid];S.order=S.order.filter(x=>x!==cid);changed=true}}
    for(const cid of [...S.order]){const k="c_"+cid;if(!remote[k]){if(S.synced[k]){delete S.chars[cid];S.order=S.order.filter(x=>x!==cid);delete S.synced[k];changed=true}else dirty.add(k)}}
    if(!remote.lib)dirty.add("lib");if(!remote.npcs&&S.npcs.length)dirty.add("npcs");
    if(upgradeLib(S.lib)){S.stamps.lib=Date.now();dirty.add("lib");changed=true}
    if(S.cur&&!S.chars[S.cur])S.cur=S.order[0]||null;
    cloud={db,col,id,user,dispName:user._name||""};try{ST.owner=!!(await user.isOwner())}catch(e){ST.owner=false}
    if(changed||ST.owner)render();updateRoster();
    if(dirty.size)await saveNow();else setStatus("cloud","Uloženo ve tvém účtu");
  }catch(e){cloud=null;cloudNote="Účet nedostupný – uloženo v prohlížeči";setStatus("local",cloudNote)}
}

function rndField(a,k,cur0,ctx){const n=lc(a.name),S0=detSchema(a),f=S0.f.find(x=>x[0]===k);

  switch(n){
   case "allies":if(k==="who")return isGroup?isGroup[0]:rndName();if(k==="role")return isGroup?isGroup[1]:role[0];break;
   case "retainers":if(k==="who")return ctx.type==="Zvíře"?pick(["Bestie","Stín","Rex","Dráp","Noční"]):rndName();if(k==="type")return ctx.type;if(k==="role")return ctx.type==="Zvíře"?role[0]:role[0];break;

function evalRoll(dice,diff){
  const succ=dice.filter(d=>d.v>=6).length,tens=dice.filter(d=>d.v===10).length,pairs=Math.floor(tens/2);

  if(diff>0)v.push(win?["good",`Win (margin ${total-diff})`,`Úspěch o ${total-diff}`]:["bad","Failure","Neúspěch"]);
  if(win&&messy)v.push(["blood","Messy Critical","Špinavý kritický úspěch – uspěješ, ale Šelma se projeví (Compulsion)."]);else if(win&&crit)v.push(["good","Critical Win","Kritický úspěch – výjimečný výsledek."]);

  else if(hOne&&diff===0)v.push(["warn","Hunger 1","Hladová jednička – při neúspěchu je to Bestial Failure."]);

function convLib(conv,val){
  if(conv==="dots")return val.split(/[,\s]+/).map(Number).filter(n=>n>=1&&n<=10).sort((a,b)=>a-b).filter((v,i,a)=>a.indexOf(v)===i);
  if(conv==="list")return val.split(",").map(s=>s.trim()).filter(Boolean);
  if(conv==="lv"){const o={};val.split("\n").forEach(l=>{const m=l.match(/^\s*(\d+)\s*[:.)-]\s*(.*)$/);if(m)o[m[1]]=m[2]});return o}
  if(conv==="disc")return textToDisc(val);if(conv==="specs")return textToSpecs(val);if(conv==="gain")return textToGain(val);return val}

function pack(kind){const base={app:"nocni-archiv",version:2,kind,exported:new Date().toISOString()};
  if(kind==="character")return {...base,data:cur()};if(kind==="library")return {...base,data:S.lib};
  return {...base,data:{chars:S.order.map(id=>S.chars[id]).filter(Boolean),lib:S.lib}}}
const slug=s=>(s||"postava").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-zA-Z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase()||"postava";
async function doExport(kind){
  const text=JSON.stringify(pack(kind),null,2);
  const name=kind==="character"?`vtm-${slug(cur().name)}.json`:kind==="library"?"vtm-knihovna.json":`vtm-zaloha-${today()}.json`;
  UI.io={name,text};render();
  try{const dl=window.claude?.use?await claude.use("downloads"):null;if(dl){await dl.save({filename:name,data:text});toast("Soubor uložen")}}catch(e){if(e&&e.code!=="declined")toast("Stažení není dostupné – zkopíruj text")}
}

function splatSVG(seed,w,h,dense){let x=seed>>>0;const R=()=>((x=(x*1664525+1013904223)>>>0)/4294967296);let o="";
  const blob=(cx,cy,r,a)=>{cx=Math.max(r+1,Math.min(w-r-1,cx));cy=Math.max(r+1,Math.min(h-r-1,cy));o+=`<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r.toFixed(2)}" fill="#b3141c" fill-opacity="${a.toFixed(2)}"/>`};
  const n=dense?7:4;for(let k=0;k<n;k++){const cx=20+R()*(w-40),cy=14+R()*(h*.62),big=2+R()*(dense?9:6);blob(cx,cy,big,.55+R()*.35);
    const m=6+Math.floor(R()*14);for(let j=0;j<m;j++){const ang=R()*6.283,d=big+R()*big*4.5;blob(cx+Math.cos(ang)*d,cy+Math.sin(ang)*d,.4+R()*big*.35,.35+R()*.5)}}
  for(let j=0;j<(dense?40:22);j++)blob(R()*w,R()*h,.3+R()*1.6,.2+R()*.45);
  return "data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}">${o}</svg>`)}
function frameSVG(w,h){const c=18,i=5,P=(d,k)=>`${d+k},${d} ${w-d-k},${d} ${w-d},${d+k} ${w-d},${h-d-k} ${w-d-k},${h-d} ${d+k},${h-d} ${d},${h-d-k} ${d},${d+k}`;
  return "data:image/svg+xml;utf8,"+encodeURIComponent(`<svg xmlns="http://www.w3.org/2000/svg" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polygon points="${P(1.5,c)}" fill="none" stroke="#9a5a52" stroke-width="1.6"/><polygon points="${P(1.5+i,c-2)}" fill="none" stroke="#9a5a52" stroke-width=".8"/></svg>`)}

async function wtExport(file){const c=cur();if(!c)return;
  try{UI.busy="Vyplňuji PDF list…";render();

    await Promise.all([loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"),loadScript("https://cdn.jsdelivr.net/npm/@pdf-lib/fontkit@1.1.1/dist/fontkit.umd.min.js")]);
    const probe=await window.PDFLib.PDFDocument.load(bytes,{ignoreEncryption:true});const fm=probe.getForm(),ok=["dot5b","disciplineslist1","merits1","history1"].every(n=>{try{fm.getField(n);return true}catch(e){return false}});
    if(!ok){UI.busy=null;render();toast("Tenhle PDF list neznám – funguje s 4stránkovým interaktivním V5 listem (Winter's Teeth).");return}
    if(file)WT_TPL={bytes:bytes.slice(0),name:file.name};
    const res=await fillWintersTeeth(bytes.slice(0),c,window.PDFLib,window.fontkit,b64bytes(WT_FONT));
    UI.busy=null;render();await saveFile(`vtm-${slug(c.name)}-V5.pdf`,new Blob([res.bytes],{type:"application/pdf"}),"application/pdf");
  }catch(e){console.error(e);UI.busy=null;render();toast("Vyplnění se nepovedlo – zkontroluj, že jde o správný PDF list.")}}
function mergeLib(lib){
  if(lib&&!lib.v)upgradeLib(lib);
  let n=0;for(const [cat] of LCATS){if(!Array.isArray(lib[cat]))continue;
    for(const it of lib[cat]){if(!it||!it.name)continue;const ex=libFind(cat,it.name);const copy={...clone(it),id:ex?ex.id:uid()};if(cat==="disciplines")copy.powers=copy.powers||[];
      if(ex)Object.assign(ex,copy);else S.lib[cat].push(copy);n++}}
  touch("lib");return n;
}
function fixChar(ch){const base=newChar();const c={...base,...ch};c.attrs={...base.attrs,...(ch.attrs||{})};c.skills={...base.skills,...(ch.skills||{})};c.trk={...base.trk,...(ch.trk||{})};c.trk.hp={...base.trk.hp,...(c.trk.hp||{})};c.trk.wp={...base.trk.wp,...(c.trk.wp||{})};["disc","adv","items","sections","xp","journal","rolls"].forEach(k=>{if(!Array.isArray(c[k]))c[k]=[]});c.disc.forEach(d=>{d.known=d.known||[];d.custom=d.custom||[];d.id=d.id||uid()});if(!/^[a-z0-9]+$/i.test(c.id||""))c.id=uid();return c}
function addChar(ch,asCopy){const c=fixChar(clone(ch));if(asCopy||!c.id)c.id=uid();if(asCopy&&S.chars[ch.id])c.name=(c.name||"")+" (kopie)";S.chars[c.id]=c;if(!S.order.includes(c.id))S.order.push(c.id);S.cur=c.id;touch("c_"+c.id);return c}

// lvl: err = porušené pravidlo, warn = chybí / k doplnění, info = upozornění; fix = automatická oprava
function auditChar(c){const out=[],A0=(lvl,sec,msg,fix)=>out.push({lvl,sec,msg,fix});if(!c)return out;
  // identita
  [["name","jméno"],["concept","koncept"],["clan","klan"],["predator","Predator Type"],["ambition","Ambition"],["desire","Desire"]].forEach(([k,l])=>{if(!String(c[k]||"").trim())A0("warn","Identity",`Chybí ${l}.`)});
  const cl=c.clan&&libFind("clans",c.clan);if(c.clan&&!cl)A0("info","Identity",`Klan „${c.clan}“ není v knihovně – Bane a klanové disciplíny se nepočítají.`);
  if(c.predator&&!libFind("predators",c.predator))A0("info","Identity",`Predator Type „${c.predator}“ není v knihovně – chybí hod lovu.`);
  if(c.predGrant?.guess)A0("info","Identity",`Výhody z typu predátora (${c.predGrant.pred}) jsou odhadnuté – zkontroluj je v Identity.`,x=>{if(x.predGrant)delete x.predGrant.guess});
  if(cl&&!["core","variant"].includes(c.baneV))A0("info","Identity","Není zvolená varianta Bane.",x=>{x.baneV="core"});
  if(cl&&c.baneV==="variant"&&!cl.vbane)A0("info","Identity","Klan nemá alternativní Bane – použije se základní.",x=>{x.baneV="core"});
  // atributy a dovednosti
  ATTR_LIST.forEach(([k,en])=>{const v=+c.attrs[k]||0;if(v<1)A0("err","Attributes",`${en} má 0 teček – minimum je 1.`,x=>{x.attrs[k]=1});if(v>5)A0("err","Attributes",`${en} má víc než 5 teček.`)});
  SKILL_LIST.forEach(([k,en])=>{const s=c.skills[k]||{};if(+s.v>5)A0("err","Skills",`${en} má víc než 5 teček.`);
    if(String(s.spec||"").trim()&&!(+s.v>0))A0("info","Skills",`${en}: specializace bez tečky v dovednosti (např. z typu predátora) – zvaž tečku.`);
    if(FREE_SPEC.includes(k)&&+s.v>0&&!String(s.spec||"").trim())A0("warn","Skills",`${en} potřebuje aspoň jednu specializaci (Academics, Craft, Performance a Science ji mají povinnou).`)});
  // disciplíny
  const dm=discMapOf(c.disc);
  c.disc.forEach(d=>{const L=d.name&&libFind("disciplines",d.name),nm=d.name||"(bez názvu)",v=+d.v||0;
    if(!d.name)A0("err","Disciplines","Disciplína bez názvu.");else if(!L)A0("info","Disciplines",`${nm} není v knihovně – síly a pooly nejsou známé.`);
    if(L){const kn=(d.known||[]);if(kn.length>v)A0("warn","Disciplines",`${nm} ${v}: má ${kn.length} ${plural(kn.length,"sílu","síly","sil")} – na každou tečku patří jedna.`);
      if(kn.length<v)A0("warn","Disciplines",`${nm} ${v}: vybráno jen ${kn.length} ${plural(kn.length,"síla","síly","sil")} – chybí ${v-kn.length}.`);
      kn.forEach(n=>{const p=L.powers.find(x=>x.name===n);if(!p)A0("info","Disciplines",`${nm}: síla „${n}“ není v knihovně.`);else{if(p.level>v)A0("err","Disciplines",`${nm}: ${n} je level ${p.level}, ale disciplína má jen ${v}.`);if(p.req&&!reqOk(p.req,dm))A0("warn","Disciplines",`${nm}: ${n} je amalgam a vyžaduje ${p.req}.`)}});
      if(L.rituals?.length&&v>0){const rs=d.rituals||[];if(!rs.length)A0("info","Disciplines",`${nm}: ${L.ritKind==="Ceremony"?"zatím žádná ceremonie":L.ritKind==="Formula"?"zatím žádná formule":"zatím žádný ritual"} – při tvorbě je jeden levelu 1 zdarma.`);
        rs.forEach(n=>{const r=L.rituals.find(x=>x.name===n);if(!r)A0("info","Disciplines",`${nm}: „${n}“ není v knihovně.`);else if(r.level>v)A0("err","Disciplines",`${nm}: ${n} je level ${r.level}, disciplína má ${v}.`)})}}});
  // výhody
  const names=c.adv.map(a=>lc(a.name));
  c.adv.forEach((a,i)=>{if(!a.name){A0("warn","Advantages","Merit/Flaw bez názvu.");return}const m=libFind("merits",a.name);
    if(!m){A0("info","Advantages",`${a.name} není v knihovně.`);}
    else{if(a.kind!==m.kind)A0("info","Advantages",`${a.name} je v knihovně jako ${(KINDS[m.kind]||[m.kind])[0]}, na listu jako ${(KINDS[a.kind]||[a.kind||"?"])[0]}.`,x=>{x.adv[i].kind=m.kind});

 attrs:{h:"Rozděl atributy",p:"Máš devět atributů. Jeden dej na 4, tři na 3, čtyři na 2 a jeden na 1.",tips:["Najeď na atribut a uvidíš, k čemu slouží.","Stamina + 3 = Health. Composure + Resolve = Willpower.","Rváč: Strength 4 · Stamina, Dexterity, Wits 3 · …","Vyjednavačka: Charisma 4 · Manipulation, Composure, Wits 3 · …"]},
 skills:{h:"Dovednosti a specializace",p:"Vyber, jak široké znalosti postava má, a rozděl tečky. Nakonec přidej specializace – stačí kliknout na návrh.",tips:["Academics, Craft, Performance a Science dostanou zdarma specializaci, pokud v nich máš aspoň 1 tečku.","K tomu jednu volnou specializaci kamkoli.","Specializace z typu predátora se přidá zvlášť v dalším kroku."]},
 pred:{h:"Jak loviš?",p:"Typ predátora popisuje, jak se živíš. Dá ti tečku disciplíny, specializaci, případně změní Humanity a přidá Merits, Backgrounds a Flaws. Vybíráš jen z toho, co typ nabízí.",tips:["Výhody a slabosti z predátora se do dalšího kroku přenesou samy a nepočítají se do limitu.","Některé typy nejsou pro všechny klany (např. Ventrue nemůže být Bagger ani Farmer).","Homebrew typy jsou vlastní tvorba – ověř je s Vypravěčem."]},
 disc:{h:"Disciplíny a síly",p:"Ze svých klanových disciplín si vezmi jednu na 2 tečky a jinou na 1 tečku. Za každou tečku vybereš jednu sílu na stejné nebo nižší úrovni.",tips:["Najeď na sílu a uvidíš, co umí.","Amalgamy vyžadují tečky v jiné disciplíně – bez nich je nelze vybrat.","Síly označené HB jsou homebrew – ověř s Vypravěčem, jestli je povoluje.","Pod každou silou je dice pool, hod proti a cena. Hvězdička * znamená dotvořené údaje.","Tečka z typu predátora se přičte automaticky."]},
 adv:{h:"Výhody a slabosti",p:"",tips:["Backgrounds = svět kolem tebe (Haven, Resources, Contacts). Merits = tvé přednosti. Flaws = komplikace.","Některé věci se vylučují (Haven × No Haven, Beautiful × Ugly). Aplikace je nepustí dohromady.","Pod každou položkou vidíš, co ti dává při zvoleném počtu teček."]},
 motiv:{h:"Co tě drží člověkem",p:"Convictions jsou zásady, které tě drží při Humanity. Ke každé patří Touchstone – živý smrtelník, který ji ztělesňuje. Vezmi 1–3. Ambition je dlouhodobý cíl, Desire to, co chceš teď.",tips:["Když Touchstone zemře nebo se ti odcizí, tvá Humanity trpí.","Touchstone potřebuje jméno a vztah: „Klára, sestra, studuje medicínu v Brně“."]},
 story:{h:"Jak vypadáš a odkud jdeš",p:"Tohle nejsou čísla, ale postava. Popiš vzhled, poznávací znamení a chování, které budeš u stolu hrát, a krátce příběh: kým jsi byl/a za života, jak proběhla přeměna a co tě váže k sire. Nic tu není povinné.",tips:["Stačí pár vět – víc doplníš během hry.","Dobrý detail chování je vidět u stolu: hlas, gesto, zlozvyk.","Smrtelný život je zdroj Touchstones, Backgrounds i háčků pro Vypravěče."]},
 sum:{h:"Zkontroluj postavu",p:"Tady vidíš výsledek. Upozornění tvorbu neblokují – domluva s Vypravěčem a homebrew mají přednost.",tips:["Po vytvoření najdeš postavu na listu, kde můžeš upravit cokoli.","Startovní XP se zapíšou do Deníku a XP. Postava se uzamkne do režimu XP – na listu pak kupuješ tečky a aplikace hlídá, jestli máš dost XP."]}
};
// úvodní okno ke každému kroku průvodce: co se tu děje, co vybíráš a proč
const WINTRO={
 concept:{what:"Dáš postavě jméno a jednou větou řekneš, kdo je – čím byl za života a čím je teď.",pick:["Jméno postavy (a své jméno jako hráče)","Kroniku – v jakém městě a příběhu hraješ","Koncept – jedna věta, třeba „Noční taxikář, který ví příliš mnoho“"],why:"Koncept je kompas. Podle něj se pak rozhoduješ ve všech dalších krocích – co umí, koho zná, jak se krmí."},
 clan:{what:"Vybereš klan – upíří rod, do kterého tě tvůj stvořitel přivedl.",pick:["Klan (Brujah, Toreador, Nosferatu…)","Prokletí (Bane) – základní, nebo alternativní verzi"],why:"Klan určuje tři disciplíny, které se učíš nejsnáz, prokletí, se kterým musíš žít, a nutkání (Compulsion), které tě občas ovládne."},
 age:{what:"Určíš, jak dlouho už jsi upírem a kdo tě přeměnil.",pick:["Věk: Childe, Neonate nebo Ancilla","Generaci a stvořitele (sire)","Startovní XP"],why:"Starší upír má silnější krev (Blood Potency) a víc výhod, ale i víc slabostí a nižší Humanity. Většina kronik začíná s Neonate."},
 attrs:{what:"Rozdělíš tečky do devíti atributů – tělo, společenské vlohy a mysl.",pick:["Jeden atribut na 4","Tři na 3, čtyři na 2 a jeden na 1"],why:"Atributy jsou základ každého hodu kostkami. Z nich se počítá i Health (Stamina + 3) a Willpower (Composure + Resolve)."},
 skills:{what:"Vybereš, co se postava za život naučila, a přidáš specializace.",pick:["Rozložení: Vyvážený, Všeuměl nebo Specialista","Tečky do dovedností","Specializace – zúžení dovednosti, které dá +1 kostku"],why:"Hod je vždy atribut + dovednost. Tady rozhoduješ, v čem bude postava dobrá a kde bude tápat."},
 pred:{what:"Vybereš typ predátora – způsob, jakým každou noc získáváš krev.",pick:["Typ predátora (Alleycat, Siren, Sandman…)","Disciplínu a specializaci, které typ dává","Výhody a slabosti, které z typu plynou"],why:"Lov je jádro hry. Typ predátora určuje, čím hážeš při lovu, a přidá postavě zázemí i potíže, které z toho stylu plynou."},
 disc:{what:"Rozdělíš tečky do disciplín – nadpřirozených schopností své krve – a vybereš síly.",pick:["Dvě tečky do jedné klanové disciplíny a jednu do druhé","Ke každé tečce jednu sílu","Případně jeden ritual nebo ceremonii zdarma"],why:"Disciplíny jsou to, co z tebe dělá upíra. Každá síla má cenu (Rouse check) a některé ohrožují Maškarádu."},
 adv:{what:"Vybereš výhody (Merits a Backgrounds) a slabosti (Flaws) a rozepíšeš je.",pick:["Merits a Backgrounds za přidělené tečky","Flaws za povinné tečky","Kdo jsou tví spojenci, služebníci, kontakty, stádo…"],why:"Backgrounds jsou svět kolem tebe – lidé a zdroje, které ve hře opravdu použiješ. Flaws dávají Vypravěči háčky na příběh."},
 motiv:{what:"Určíš, co postavu drží člověkem a co chce.",pick:["Convictions – zásady, které nepřekročíš","Touchstones – živé lidi, kteří ty zásady ztělesňují","Ambition a Desire – dlouhodobý cíl a touhu na teď"],why:"Když jednáš proti svým zásadám nebo přijdeš o Touchstone, trpí Humanity. Ambition a Desire dávají postavě směr ve hře."},
 story:{what:"Popíšeš, jak postava vypadá a jak se chová, a krátce její příběh.",pick:["Vzhled a poznávací znamení","Chování, hlas a manýry","Smrtelný život, přeměnu a vztah k sire"],why:"Čísla říkají, co postava umí – tohle říká, kdo je. Vypravěč z toho bere háčky na příběh a ostatní hráči si tě zapamatují."},
 sum:{what:"Zkontroluješ celou postavu, než ji vytvoříš.",pick:["Projdi přehled a případná upozornění","Klikni na krok, který chceš opravit"],why:"Po vytvoření se postava uzamkne – další zlepšení už stojí XP. Teď je poslední chvíle měnit věci zdarma."}};
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&document.querySelector(".modal.intro")){A.wzIntroClose()}});
let NOINTRO=false;try{NOINTRO=localStorage.getItem(LKEY+"-nointro")==="1"}catch(e){}
function wzIntroModal(k,n){const w=S.draft.wz;w.seen=w.seen||{};const open=UI.introOpen===k||(!NOINTRO&&!w.seen[k]);if(!open)return "";
  const I=WINTRO[k],[,en,cz]=WSTEPS.find(x=>x[0]===k)||[];if(!I)return "";
  return `<div class="modal-bg" data-act="wzIntroClose"><div class="modal intro" role="dialog" aria-modal="true" aria-labelledby="wiT" data-act="modalNoop">
   <span class="label">Krok ${n} z ${WSTEPS.length}</span><h3 id="wiT">${esc(en)} <span class="small muted" style="font-family:var(--f-body)">· ${esc(cz)}</span></h3>
   <p class="lead">${esc(I.what)}</p>
   <div class="ibox"><b>Co tu vybíráš</b><ul>${I.pick.map(x=>`<li>${esc(x)}</li>`).join("")}</ul></div>
   <div class="ibox why"><b>Proč na tom záleží</b><p>${esc(I.why)}</p></div>
   <p class="small muted">Nápověda zůstává i vlevo vedle kroku. Úvod kdykoli znovu otevřeš tlačítkem „? Úvod kroku“.</p>
   <div class="inline" style="justify-content:space-between;margin-top:12px;flex-wrap:wrap;gap:10px"><label class="small inline"><input type="checkbox" data-act="wzIntroOff" ${NOINTRO?"checked":""} style="accent-color:var(--blood)"> Úvody už neukazovat</label><button class="btn pri" data-act="wzIntroClose">Jdu na to</button></div></div></div>`}
function vWiz(){
  const D0=S.draft,[k,en,cz]=WSTEPS[D0.step],g1=WG[k],iss=wzIssues(),mine=iss.filter(x=>x[0]===k);
  let p=g1.p;if(k==="adv"){const a=advSums();p=`Máš ${a.mNeed} teček na Merits a Backgrounds a musíš si vzít ${a.fNeed} ${plural(a.fNeed,"tečku","tečky","teček")} Flaws.`}
  return `<ol class="steps">${WSTEPS.map(([sk,se,sc],i)=>`<li><button data-act="wzGo" data-i="${i}" title="${sc}" aria-current="${i===D0.step}" class="${i<D0.step&&!iss.some(x=>x[0]===sk)?"done":""}"><span class="mono">${i+1}</span>${se}</button></li>`).join("")}</ol>
  <div class="wiz"><aside class="guide"><span class="label">Krok ${D0.step+1} z ${WSTEPS.length}</span><h2>${T(en,cz)}</h2><p><b>${g1.h}</b></p><p>${p}</p><ul>${g1.tips.map(t=>`<li>${t}</li>`).join("")}</ul>
  <div class="inline" style="margin-top:6px">${k!=="sum"?`<button class="btn sm" data-act="wzRandStep" data-k="${k}">Náhodně vyplnit tento krok</button>`:""}${UI.confirm==="rall"?`<span class="confirm">Přepsat celou postavu? <button class="btn sm pri" data-act="wzRandAll">Ano</button><button class="btn sm" data-act="cancel">Ne</button></span>`:`<button class="btn sm ghost" data-act="askRandAll">Náhodná postava (vše)</button>`}</div>
  <p class="small muted">Náhoda dodržuje pravidla V5 – výsledek pak můžeš libovolně upravit.</p><button class="btn sm ghost" data-act="wzIntroOpen" data-k="${k}" style="margin-top:6px">? Úvod kroku</button></aside>
  <div class="work">${WB[k]()}
  ${k!=="sum"?(mine.length?`<div class="issues">${mine.map(x=>`<div>${esc(x[1])}</div>`).join("")}</div>`:`<div class="allok">Tento krok je hotový.</div>`):""}
  <div class="wnav"><button class="btn" data-act="wzPrev" ${D0.step===0?"disabled":""}>← Zpět</button>${k==="sum"?`<button class="btn pri" data-act="wzFinish">Vytvořit postavu</button>`:`<button class="btn pri" data-act="wzNext">Dál: ${WSTEPS[D0.step+1][1]} →</button>`}</div></div></div>${UI.wzWarn?wzWarnModal(k):wzIntroModal(k,D0.step+1)}`;
}
const discCard=(n,pressed,act,extra="",dis="")=>{const L=libFind("disciplines",n);return `<button class="opt" data-act="${act}" data-n="${esc(n)}" ${extra} aria-pressed="${pressed}"${dis?" disabled":""} data-tip="${esc(L?.use||"")}"><span class="inline"><strong>${esc(n)}</strong>${L?srcChip(L.source):""}</span><span>${esc(L?.desc||"Bez popisu – doplň v Knihovně.")}</span>${discInfo(L,true)}${dis?`<span class="why">${esc(dis)}</span>`:""}</button>`};
const WB={
 concept(){return `<div class="grid g2">${wf("c.name","Name","Jak se postava jmenuje?")}${wf("c.player","Player")}${wf("c.chronicle","Chronicle","např. Praha by Night")}</div>${wf("c.concept","Concept","Jedna věta o postavě")}
  ${exChips("c.concept",["Noční taxikář, který ví příliš mnoho","Kurátorka galerie, co sbírá cizí tajemství","Vyhořelý kriminalista","Influencerka, která už nesmí na slunce","Bývalý kněz hledající rozhřešení","Hacker ze Žižkova"])}`},
 clan(){const c=S.draft.c,cl=libFind("clans",c.clan);
  return `<div class="opts">${S.lib.clans.map(x=>`<button class="opt" data-act="wzClan" data-n="${esc(x.name)}" aria-pressed="${c.clan===x.name}"><span class="inline"><strong>${esc(x.name)}</strong>${srcChip(x.source)}</span><span>${esc(x.disciplines)}</span><span class="muted">Bane: ${esc(x.bane?.n||"")}${x.vbane?` · alt. ${esc(x.vbane.n)}`:""}</span></button>`).join("")}</div>
  ${cl?`<div class="card"><div class="wsub">${G("Bane")}</div><p class="small muted" style="margin-bottom:10px">Vyber, které prokletí tvá postava nese.</p><div class="list">
   <label class="radio${c.baneV!=="variant"?" on":""}"><input type="radio" name="bane" data-act="wzBane" data-v="core" ${c.baneV!=="variant"?"checked":""}><span><b>${esc(cl.bane.n)}</b> <span class="muted small">základní</span><br><span class="small">${esc(cl.bane.t)}</span></span></label>
   ${cl.vbane?`<label class="radio${c.baneV==="variant"?" on":""}"><input type="radio" name="bane" data-act="wzBane" data-v="variant" ${c.baneV==="variant"?"checked":""}><span><b>${esc(cl.vbane.n)}</b> <span class="muted small">alternativní · ${Ti("Variant Bane","",GL["Variant Bane"][1])}</span><br><span class="small">${esc(cl.vbane.t)}</span></span></label>`:`<p class="small muted">Tento klan nemá alternativní prokletí.</p>`}</div>
   ${cl.comp?`<p class="small" style="margin-top:12px">${Ti("Compulsion","Nutkání",GL.Compulsion[1])}: <b>${esc(cl.comp.n)}</b> – ${esc(cl.comp.t)}</p>`:""}</div>`:""}
  <div class="grid g2">${wf("c.clan","Clan","napiš vlastní","Jiný klan nebo rodokmen")}</div>`},
 age(){const w=S.draft.wz,ag=wzAge();return `<div class="opts">${Object.entries(AGES).map(([key,a])=>`<button class="opt" data-act="wzAge" data-a="${key}" aria-pressed="${w.age===key}"><strong>${T(a.en,a.cz)}</strong><span>${a.desc}</span><span class="mono small">Start: ${a.xp} XP</span></button>`).join("")}</div>
  <div class="grid g4">${wf("c.generation","Generation")}${wf("c.sire","Sire","kdo tě přeměnil")}${wf("c.embrace","Embraced","např. 2009")}<label class="field"><span class="label">${G("Starting XP")}</span><input type="number" min="0" data-df="wz.xp" value="${esc(w.xp)}"></label></div>
  <p class="small muted">Blood Potency pro ${ag.en}: <b class="mono">${ag.bp}</b></p>`},
 attrs(){const c=S.draft.c,ac=cnt(ATTR_LIST.map(([k])=>c.attrs[k]||0));
  return `<div class="need-row"><span class="small muted">Rozdělení:</span>${needChips(ATTR_NEED,ac)}${ac[0]?`<span class="need">nepřiřazeno ${ac[0]}</span>`:""}</div>
  <div class="grid g3">${ATTRS.map(([g2,gc,a])=>`<div class="trait-col"><span class="label">${T(g2,gc)}</span>${a.map(([k,n,cz,ds])=>`<div class="wtrait">${T(n,cz,ds)}${dots("c.attrs."+k,c.attrs[k],4,"","d")}</div>`).join("")}</div>`).join("")}</div>
  ${distWarn(ATTR_NEED,(({0:_,...r})=>r)(ac),"4 / 3 / 3 / 3 / 2 / 2 / 2 / 2 / 1",ac[0]||0)}
  <p class="small muted">Health ${(c.attrs.sta||0)+3} · Willpower ${(c.attrs.com||0)+(c.attrs.res||0)}</p>`},
 skills(){const c=S.draft.c,w=S.draft.wz,sc=cnt(SKILL_LIST.map(([k])=>c.skills[k].v).filter(v=>v>0)),sp=specState(),withDots=SKILL_LIST.filter(([k])=>c.skills[k].v>0);
  return `<div class="opts">${Object.entries(SKILL_DIST).map(([key,d])=>`<button class="opt" data-act="wzDist" data-d="${key}" aria-pressed="${w.dist===key}"><strong>${T(d.en,d.cz)}</strong><span>${d.desc}</span></button>`).join("")}</div>
  <div class="need-row"><span class="small muted">Rozdělení:</span>${needChips(SKILL_DIST[w.dist].need,sc)}</div>
  <div class="grid g3">${SKILLS.map(([g2,gc,a])=>`<div class="trait-col"><span class="label">${T(g2,gc)}</span>${a.map(([k,n,cz,ds])=>`<div class="wtrait">${T(n,cz,ds+(FREE_SPEC.includes(k)?"\nSpecializace zdarma, pokud máš aspoň 1 tečku.":""))}${dots("c.skills."+k+".v",c.skills[k].v,4,"","d")}</div>`).join("")}</div>`).join("")}</div>
  ${distWarn(SKILL_DIST[w.dist].need,sc,`podle ${SKILL_DIST[w.dist].en} (${SKILL_DIST[w.dist].cz})`,Object.values(SKILL_DIST[w.dist].need).reduce((a,b)=>a+b,0)>Object.values(sc).reduce((a,b)=>a+b,0)?1:0)}
  <div class="card"><div class="card-h"><span class="wsub">${G("Specialties")}</span><span class="need ${sp.have===sp.need?"ok":sp.have>sp.need?"over":""}" id="specNeed">${sp.have}/${sp.need}</span></div>
  ${withDots.length?withDots.map(([k,n,cz,,sug])=>`<div class="specrow"><div class="top"><span style="min-width:130px">${T(n,cz)}${FREE_SPEC.includes(k)?' <span class="req">povinná</span>':""}</span><input type="text" class="grow" data-df="c.skills.${k}.spec" value="${esc(c.skills[k].spec)}" placeholder="vlastní nebo vyber níže"></div><div class="exs">${sug.map(x=>`<button class="ex" data-act="wzSpecSug" data-k="${k}" data-v="${esc(x)}">${esc(x)}</button>`).join("")}</div></div>`).join(""):`<p class="small muted">Nejdřív přiděl tečky dovednostem.</p>`}</div>`},
 pred(){const c=S.draft.c,w=S.draft.wz,pr=wzPred();
  let h=`<div class="opts">${S.lib.predators.map(p=>{const no=p.noClans?.map(lc).includes(lc(c.clan))?`Není pro ${c.clan}`:"";return `<button class="opt" data-act="wzPred" data-n="${esc(p.name)}" aria-pressed="${c.predator===p.name}"${no?" disabled":""}><span class="inline"><strong>${esc(p.name)}</strong>${srcChip(p.source)}</span><span>${esc(p.desc)}</span><span class="mono small">${esc(p.pool)}</span>${no?`<span class="why">${no}</span>`:""}</button>`}).join("")}</div>`;
  if(!pr)return h;
  const opts=predDiscOpts(pr,c.clan),dm=wzDiscMap();
  h+=`<div class="card"><div class="wsub">1. ${T("Discipline +1","Disciplína +1 tečka")}</div><p class="small muted" style="margin:4px 0 10px">${esc(pr.name)} ti dá tečku v jedné z těchto disciplín.</p>

function rndPowers(discName,dots,dm,known=[]){const L=libFind("disciplines",discName);if(!L||!L.powers.length)return [];const out=known.slice();let guard=60;
  while(out.length<dots&&guard--){const ok=L.powers.filter(p=>p.level<=dots&&!out.includes(p.name)&&(!p.req||reqOk(p.req,dm)));if(!ok.length)break;const off=ok.filter(p=>!p.src),pool=off.length?off:ok;const lv=pool.filter(p=>p.level<=out.length+1);out.push(pick(lv.length?lv:pool).name)}return out}
function wzRand(k){const D0=S.draft,c=D0.c,w=D0.wz;
  if(k==="concept"){c.name=rndName();c.concept=pick(CONCEPTS)}
  if(k==="clan"){c.clan=pick(MAIN_CLANS);c.baneV=libFind("clans",c.clan)?.vbane&&Math.random()<.25?"variant":"core";w.d2="";w.d1="";w.known={};const pr=wzPred();if(pr?.noClans?.map(lc).includes(lc(c.clan))){c.predator="";resetPred(w)}}
  if(k==="age"){w.age="neonate";w.xp=AGES.neonate.xp;c.generation=pick(["12th","13th"]);c.sire=rndName();c.embrace=String(rint(1960,2022))}
  if(k==="attrs"){const vals=shuf([4,3,3,3,2,2,2,2,1]);ATTR_LIST.forEach(([key],i)=>c.attrs[key]=vals[i])}
  if(k==="skills"){if(!w.distSet||!SKILL_DIST[w.dist])w.dist=pick(["balanced","balanced","jack","specialist"]);const need=SKILL_DIST[w.dist].need,order=shuf(SKILL_LIST.map(x=>x[0]));SKILL_LIST.forEach(([key])=>c.skills[key]={v:0,spec:""});let i=0;
    Object.keys(need).map(Number).sort((a,b)=>b-a).forEach(l=>{for(let n=0;n<need[l];n++)c.skills[order[i++]].v=l});
    SKILL_LIST.forEach(([key,,,,sg])=>{if(FREE_SPEC.includes(key)&&c.skills[key].v>0)c.skills[key].spec=pick(sg)});
    const wd=SKILL_LIST.filter(([key])=>c.skills[key].v>0&&!c.skills[key].spec),f=pick(wd.length?wd:SKILL_LIST.filter(([key])=>c.skills[key].v>0));
    if(f){const sk=c.skills[f[0]],opts=f[4].filter(x=>!String(sk.spec).split(", ").includes(x));sk.spec=sk.spec?sk.spec+", "+pick(opts):pick(opts)}}
  if(k==="pred"){if(!c.clan)wzRand("clan");const ok=S.lib.predators.filter(p=>p.source!=="Homebrew"&&!(p.noClans||[]).map(lc).includes(lc(c.clan)));const pr=pick(ok);c.predator=pr.name;resetPred(w);
    const opts=predDiscOpts(pr,c.clan);if(opts.length)w.predDisc=pick(opts).n;
    if(pr.specs.length)w.predSpec=rint(0,pr.specs.length-1);else{w.predSpec="other";w.predSkill=pick(SKILL_LIST)[0];w.predSpecFree="lov"}
    (pr.gain||[]).forEach((sl,i)=>{if(sl.split){const o={};for(let n=0;n<sl.split;n++){const free=sl.among.filter(([nm])=>{const L=libFind("merits",nm);return (o[nm]||0)<(L?Math.max(...L.dots):sl.split)});if(!free.length)break;const nm=pick(free)[0];o[nm]=(o[nm]||0)+1}w.predSplit[i]=o}else if(sl.length>1)w.predPick[i]=rint(0,sl.length-1)})}
  if(k==="disc"){if(!c.clan)wzRand("clan");if(!c.predator)wzRand("pred");const ch=shuf(wzDiscChoices());if(!isThin(c)){w.d2=ch[0]||"";w.d1=ch[1]||""}w.known={};
    const dd=wzDiscDots(),dm=wzDiscMap();Object.entries(dd).forEach(([n,v])=>{w.known[n]=rndPowers(n,v,dm)});w.rit={};Object.entries(dd).forEach(([n,v])=>{const L=libFind("disciplines",n);const ok=(L?.rituals||[]).filter(r=>r.level===1&&!ritBlock(r,v,w.known[n]));if(ok.length)w.rit[n]=pick(ok).name})}
  if(k==="adv"){c.adv=[];const ag=wzAge(),pg=predGains(),ctx={clan:c.clan,discs:wzDiscMap()};
    const fill=(kinds,need)=>{let left=need,guard=300;while(left>0&&guard--){const m=pick(S.lib.merits.filter(x=>kinds.includes(x.kind)&&!x.tb&&x.source!=="Homebrew"&&x.group!=="Archaic"));const rows=c.adv.concat(pg);
      if(pg.some(x=>lc(x.name)===lc(m.name))||advBlock(m,rows,ctx)||advHint(m,rows))continue;const opts=m.dots.filter(d=>d<=left);if(!opts.length)continue;const v=pick(opts);c.adv.push({id:uid(),kind:m.kind,name:m.name,v,note:""});left-=v}};
    fill(["background","merit"],7+ag.adv);fill(["flaw"],2+ag.flaw);
    w.det={};{const fin=wzFinalAdv(),ks=detKeys(fin),dc={disc:Object.keys(wzDiscDots()).map(n=>({name:n}))};fin.forEach((a,i)=>{const d=rndDet(a,dc);if(d)w.det[ks[i]]=d})}}
  if(k==="story"){c.story={};STORY.forEach(([sk,,,,ex])=>c.story[sk]=pick(ex))}
  if(k==="motiv"){const cs=shuf(CONVICTIONS);w.convs=Array.from({length:rint(1,2)},(_,i)=>({c:cs[i],t:rndTouch()}));c.ambition=pick(AMBITIONS);c.desire=pick(DESIRES)}
}

function genNpc(type,clan,sex){if(!NPC_TYPES[type])type=pick(["mortal","ghoul","neonate","neonate","ancilla","ancilla","elder"]);const T0=NPC_TYPES[type];sex=sex==="m"||sex==="f"?sex:pick(["m","f"]);

  const base=[rint(...T0.base),rint(...T0.base),rint(...T0.base)];base[rint(0,2)]++;const [phys,soc,ment]=base,cats={Physical:phys,Social:soc,Mental:ment};
  const sk=shuf(SKILLS.flatMap(([gEn,,arr])=>arr.map(x=>[x[1],gEn])));const exc=T0.exc.map((b,i)=>({n:sk[i][0],v:cats[sk[i][1]]+b}));

  dot:t=>{const d=t.dataset.scope==="d",o=d?S.draft:cur(),p=t.dataset.path,v=+t.dataset.v,old=+getPath(o,p)||0;let nv=old===v?v-1:v;

  buyOk:()=>{const b=UI.buy,c=cur();if(!b||!c)return;
    if(b.kind==="up"){if(b.cost>xpAvail(c)){toast("Nedostatek XP");UI.buy=null;render();return}setPath(c,b.path,b.to);b.steps.forEach(x=>c.xp.push({id:uid(),date:today(),amt:-x.c,note:`${b.label} → ${x.l}`,key:b.key,lvl:x.l}));toast(`Koupeno za ${b.cost} XP`)}

    else if(b.kind==="spec"){const v=(document.getElementById("buySpec")?.value||"").trim();if(!v){toast("Napiš název specializace");return}if(xpAvail(c)<3){toast("Nedostatek XP");return}const sk=c.skills[b.sk];sk.spec=sk.spec?sk.spec+", "+v:v;c.xp.push({id:uid(),date:today(),amt:-3,note:`Specialty: ${SK[b.sk][1]} (${v})`,key:"spec:"+b.sk,lvl:0})}
    else if(b.kind==="ritual"){const dd=c.disc[b.i],n=(document.getElementById("buyRitN")?.value||"").trim(),l=Math.max(1,+(document.getElementById("buyRitL")?.value)||1),cost=l*3;
      if(!n){toast("Napiš název");return}if(l>(dd.v||0)){toast(`Level ${l} je vyšší než ${dd.name} ${dd.v}.`);return}if(cost>xpAvail(c)){toast(`Stojí ${cost} XP, máš ${xpAvail(c)} XP.`);return}
      const id=uid();dd.custom.push({id,level:l,name:n,note:"Ritual / Ceremony / Formula"});c.xp.push({id:uid(),date:today(),amt:-cost,note:`${n} (level ${l}) – ${dd.name}`,key:"rit:"+id,lvl:l})}
    else if(b.kind==="adv"){if(b.cost>xpAvail(c)){toast("Nedostatek XP");return}b.apply()}
    else if(b.kind==="rm"){c.xp=c.xp.filter(x=>x.key!==b.key);c[b.arr].splice(b.i,1)}
    else if(b.kind==="rm2"){b.apply()}
    else if(b.kind==="unlock"){c.xpMode=false}
    else if(b.kind==="hum"){A.humGift();return}
    UI.buy=null;touchChar();render()},

  feed:()=>{const c=cur(),F=UI.feed,from=c.trk.hunger;
    const B=bpRow(c),floor=F.kill?0:B[6],noDrop=from<=floor;
    const want=Math.min(F.n,5),eff=Math.max(0,want-B[5]),to=noDrop?from:Math.max(floor,from-eff),got=from-to;
    c.trk.hunger=to;c.res=rollRes();c.res.note=pick(RES_VICTIM[c.res.type]||RES_VICTIM[""]);
    if(F.kill){c.trk.stains=Math.min(10,c.trk.stains+(+F.ks||1))}
    const R1=RES[c.res.type];
    c.lastFeed={from,to,killed:F.kill,state:victimState(want,F.cond,F.kill),frenzy:from>=4,res:R1?`${c.res.type} (${c.res.temp})${c.res.temp==="Acute"&&F.kill?" – oběť zemřela, Dyscrasia je tvoje":""}`:"žádná výrazná"};
    UI.roller.hunger=null;F.kill=false;touchChar();render();
    toast(noDrop?`Nakrmeno, ale Hunger zůstává ${from} – bez zabití neklesne pod ${floor} (Blood Potency ${c.bp}).${c.lastFeed.killed?` · +${F.ks} Stain`:""}`:`Hunger ${from} → ${to}${c.lastFeed.killed?` · +${F.ks} Stain`:""}${from>=4?" · hoď na Frenzy":""}`)},
  frenzyRoll:()=>{const c=cur(),diff=Math.max(1,+(document.getElementById("frDiff")?.value)||3),wp=Math.max(0,wpMax(c)-c.trk.wp.sup-c.trk.wp.agg),pool=Math.max(1,wp+Math.floor(c.trk.hum/3));
    const dice=Array.from({length:pool},()=>({v:d10(),h:false})).sort((a,b)=>b.v-a.v),ev=evalRoll(dice,diff);
    const r={id:uid(),kind:"frenzy",label:`Frenzy test: Willpower ${wp} + Humanity/3 ${Math.floor(c.trk.hum/3)}`,time:stamp(),dice,diff,text:ev.win?"Odoláno – ovládneš se a přestaneš pít.":"Frenzy! Šelma přebírá kontrolu – Vypravěč popíše, co se stane."};
    r.summary=r.text;c.rolls.unshift(r);c.rolls=c.rolls.slice(0,15);if(c.lastFeed)c.lastFeed.frenzy=false;UI.fresh=true;touchChar();render();window.scrollTo({top:0})},
  remorse:()=>{const c=cur();if(!c.trk.stains){toast("Nemáš žádné Stains.");return}const pool=Math.max(1,10-c.trk.hum-c.trk.stains);

    const r={id:uid(),kind:"remorse",label:`Remorse: ${pool} ${plural(pool,"kostka","kostky","kostek")} (prázdná políčka Humanity)`,time:stamp(),dice,diff:1,text:ok?"Výčitky tě udržely – Humanity zůstává, Stains se smažou.":`Humanity ${from} → ${c.trk.hum}. Stains se smažou.`};
    r.summary=r.text;c.rolls.unshift(r);c.rolls=c.rolls.slice(0,15);UI.fresh=true;touchChar();render();toast(r.text)},
  mend:()=>{const c=cur(),v=d10(),ok=v>=6;if(!ok){if(c.trk.hunger<5)c.trk.hunger++;else toast("Hunger 5 – hrozí hladové šílenství")}const h=Math.min(c.trk.hp.sup,bpRow(c)[1]);c.trk.hp.sup-=h;

  power:t=>{const c=cur(),d=c.disc[+t.dataset.i],n=t.dataset.name;
    if(d.known.includes(n)&&c.xpMode){t.checked=true;toast("Postava je uzamčená – naučenou sílu nejde odebrat ani vyměnit.");return}

  // výběr výhod
  pickOpen:t=>{UI.pick.open=true;UI.pick.ctx=t.dataset.ctx;render()},pickClose:()=>{UI.pick.open=false;render()},
  pickKind:t=>{UI.pick.kind=t.dataset.k;render()},
  pickAdv:t=>{const m=S.lib.merits.find(x=>x.id===t.dataset.id);if(!m)return;const d=t.dataset.scope==="d",list=d?S.draft.c.adv:cur().adv,upg=(m.upg||[]).map(lc);
    let v=m.dots[0];if(d){const p=predGains().find(x=>lc(x.name)===lc(m.name)&&!m.multi);if(p){const al=m.dots.filter(x=>x>p.v).map(x=>x-p.v);v=al[0]||1}}

    if(!d&&cur().xpMode){const c=cur(),goneV=gone.reduce((a,r)=>a+(+r.v||0),0),cost=m.kind==="flaw"?0:3*Math.max(0,v-goneV),av=xpAvail(c);

      UI.buy={kind:"adv",label:m.name+(gone.length?` (místo ${gone.map(r=>r.name).join(", ")})`:"")+" "+"●".repeat(v),cost,free:m.kind==="flaw"?"Flaw ve hře přidávej jen se souhlasem Vypravěče – XP za něj nezískáš.":"",
        apply:()=>{const keys=gone.map(r=>"adv:"+r.id);const row=doIt();c.xp=c.xp.map(x=>keys.includes(x.key)?{...x,key:"adv:"+row.id}:x);if(m.kind!=="flaw")for(let l=goneV+1;l<=v;l++)c.xp.push({id:uid(),date:today(),amt:-3,note:`${m.name} → ${l}`,key:"adv:"+row.id,lvl:l})}};

const tip=document.getElementById("tip");let tipEl=null;
function showTip(el){const t=el.getAttribute("data-tip");if(!t){hideTip();return}tip.textContent=t;tip.hidden=false;tipEl=el;
  const r=el.getBoundingClientRect(),tw=tip.offsetWidth,th=tip.offsetHeight;let x=Math.min(Math.max(8,r.left),window.innerWidth-tw-8),y=r.bottom+6;if(y+th>window.innerHeight-8)y=r.top-th-6;tip.style.left=x+"px";tip.style.top=Math.max(8,y)+"px"}
function hideTip(){if(tip){tip.hidden=true;tipEl=null}}
document.addEventListener("mouseover",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el){if(el!==tipEl)showTip(el)}else if(tipEl&&document.activeElement!==tipEl)hideTip()});
document.addEventListener("focusin",e=>{const el=e.target.closest&&e.target.closest("[data-tip]");if(el)showTip(el);else hideTip()});
document.addEventListener("focusout",()=>setTimeout(()=>{if(!document.activeElement?.closest?.("[data-tip]"))hideTip()},0));
window.addEventListener("scroll",hideTip,{passive:true});

    if(t.dataset.f==="clan"||t.dataset.f==="predator"){const ci=document.getElementById("clanInfo");if(ci)ci.innerHTML=clanInfoHtml(c)}}
  else if(t.dataset.df&&S.draft){setPath(S.draft,t.dataset.df,readVal(t));wzSave();
    if(/^c\.skills\.\w+\.spec$/.test(t.dataset.df)){const el=document.getElementById("specNeed"),sp=specState();if(el){el.textContent=`${sp.have}/${sp.need}`;el.className="need "+(sp.have===sp.need?"ok":sp.have>sp.need?"over":"")}}
    if(t.dataset.df==="c.name")document.getElementById("who").textContent=`Tvorba postavy: ${S.draft.c.name||"bez jména"}`}
  else if(t.dataset.lf){setPath(S.lib,t.dataset.lf,readVal(t));touch("lib")}
  else if(t.dataset.nf){setPath(S.npcs,t.dataset.nf,readVal(t));touch("npcs")}
  else if(t.dataset.nfp){setPath(S.npcs,t.dataset.nfp,t.value.split(",").map(x=>x.trim()).filter(Boolean));touch("npcs")}
  else if(t.dataset.ng){UI.npcGen[t.dataset.ng]=t.value}
  else if(t.dataset.lt){setPath(S.lib,t.dataset.lt,convLib(t.dataset.conv,t.value));touch("lib")}
  else if(t.dataset.r){const R0=UI.roller,k=t.dataset.r;R0[k]=readVal(t);if(k==="hunger")R0.hunger=t.value===""?null:+t.value;rerenderSoft()}
  else if(t.dataset.x){UI.xpCalc[t.dataset.x]=t.value;rerenderSoft()}
  else if(t.id==="libQ"||t.id==="pickQ"||t.id==="npcQ"){if(t.id==="libQ")UI.libQ=t.value;else if(t.id==="npcQ")UI.npcQ=t.value;else UI.pick.q=t.value;const id=t.id,pos=t.selectionStart;render();const n=document.getElementById(id);if(n){n.focus();n.setSelectionRange(pos,pos)}}
  else if(t.id==="custKind")UI.custKind=t.value;
});
document.addEventListener("change",e=>{const t=e.target;
  if(t.dataset.pm&&UI.predChange){const M=UI.predChange;if(t.dataset.pm==="to"){predModalInit(cur(),t.value)}else setPath(M,t.dataset.pm,t.value);render();return}
  if(t.dataset.f==="predator"&&cur()&&UI.tab==="sheet"&&!cur().xpMode){const c=cur();ensurePredGrant(c);const g=c.predGrant,nv=t.value;
    if(libFind("predators",nv)&&(!g||lc(nv)!==lc(g.pred))){c.predator=g?g.pred:"";predModalInit(c,nv);render();return}}
  if(t.dataset.item&&t.dataset.f&&cur()){const it=getPath(cur(),t.dataset.f.replace(/\.name$/,"")),L=libFind("items",t.value);if(it&&L){if(!it.cat)it.cat=L.cat||"";if(!it.dmg)it.dmg=L.dmg||"";if(!it.armor)it.armor=L.armor||"";if(!it.note)it.note=L.desc||"";touchChar();render()}return}
  if(t.dataset.actChange==="portrait"){const f=t.files&&t.files[0],id=t.dataset.id;t.value="";if(f)setPortrait(id,f);return}
  if(t.dataset.actChange==="wtFile"){const f=t.files&&t.files[0];t.value="";if(f)wtExport(f);return}
  if(t.dataset.rr||(t.dataset.f&&t.tagName==="SELECT"))render();
  else if(t.dataset.df&&(t.tagName==="SELECT"||t.type==="checkbox"))render();
  else if(t.dataset.r&&t.tagName==="SELECT")render();
  else if(t.dataset.uv){UI[t.dataset.uv]=t.type==="checkbox"?t.checked:t.value;render()}
  else if(t.dataset.fd){UI.feed[t.dataset.fd]=t.type==="checkbox"?t.checked:+t.value||t.value;if(t.dataset.fd==="kill"&&!t.checked)UI.feed.n=Math.min(UI.feed.n,Math.max(1,(cur()?.trk.hunger||1)-1));render()}
  else if(t.dataset.f&&t.type==="checkbox")render();
  else if(t.dataset.nf&&t.tagName==="SELECT")render();
  if(t.id==="impFile"&&t.files[0]){const fr=new FileReader();fr.onload=()=>{try{importObj(JSON.parse(fr.result))}catch(err){toast("Soubor není platný export")}};fr.readAsText(t.files[0])}
});
function rerenderSoft(){const a=document.activeElement,key=a&&(a.dataset.r||a.dataset.x),typ=a&&a.dataset.r?"r":"x";render();if(key){const n=document.querySelector(`[data-${typ}="${key}"]`);if(n)n.focus()}}

const FIREBASE_CONFIG={
  apiKey:"AIzaSyAgwk1JiHnAWnuCQ2shJs0YrVvutzLNe7s",
  authDomain:"kronika-krve.firebaseapp.com",
  projectId:"kronika-krve",
  storageBucket:"kronika-krve.firebasestorage.app",
  messagingSenderId:"895403026603",

};
// 2) E-mail Vypravěče – jen tento účet vidí postavy všech hráčů (musí sedět i v pravidlech Firestore)
const STORYTELLER_EMAIL="patrik.stastny@email.cz";

const WEB={on:!!FIREBASE_CONFIG.apiKey,auth:null,fs:null,user:null};
function fbDocRef(path){return WEB.fs.doc(path)}
function fbAdapter(){const snapDoc=d=>({id:d.id,exists:d.exists,data:()=>d.exists?d.data():undefined});
  const docApi=path=>{const r=fbDocRef(path);return {id:r.id,path,get:async()=>snapDoc(await r.get()),set:d=>r.set(d),update:d=>r.update(d),delete:()=>r.delete()}};
  const colApi=path=>{const r=WEB.fs.collection(path);return {path,doc:id=>docApi(path+"/"+id),get:async()=>{const q=await r.get();return {docs:q.docs.map(snapDoc),size:q.size,empty:q.empty}}}};
  return {doc:docApi,collection:colApi}}
function fbUser(u){return {_name:u.displayName||u.email||"",id:async()=>u.uid,isOwner:async()=>!!u.email&&u.email.toLowerCase()===STORYTELLER_EMAIL.toLowerCase()&&(u.emailVerified||u.providerData.some(p=>p.providerId==="google.com")),profiles:async()=>({})}}
function loginHTML(msg,err){return `<div class="modal-bg" style="z-index:80"><div class="modal" style="max-width:420px">
  <h3>Kronika krve</h3><p class="small muted" style="margin:4px 0 14px">Přihlas se – tvoje postavy se ukládají do tvého účtu a uvidíš je na každém počítači.</p>
  ${err?`<p class="note" style="color:var(--blood);margin-bottom:10px">${esc(err)}</p>`:""}${msg?`<p class="note" style="margin-bottom:10px">${esc(msg)}</p>`:""}
  <button class="btn pri" style="width:100%;margin-bottom:12px" data-act="fbGoogle">Přihlásit přes Google</button>
  <div class="small muted" style="text-align:center;margin:4px 0 10px">nebo e-mailem</div>
  <label class="field"><span class="label">E-mail</span><input type="email" id="fbMail" autocomplete="email"></label>
  <label class="field" style="margin-top:8px"><span class="label">Heslo</span><input type="password" id="fbPass" autocomplete="current-password"></label>
  <div class="inline" style="margin-top:12px;gap:8px;flex-wrap:wrap"><button class="btn pri" data-act="fbLogin">Přihlásit</button><button class="btn" data-act="fbRegister">Vytvořit účet</button><button class="btn ghost sm" data-act="fbReset">Zapomenuté heslo</button></div>
  <p class="small muted" style="margin-top:12px">Bez přihlášení: <button class="btn sm ghost" data-act="fbOffline">pokračovat jen v tomto prohlížeči</button></p></div></div>`}
function showLogin(msg,err){let el=document.getElementById("fbLogin");if(!el){el=document.createElement("div");el.id="fbLogin";document.body.appendChild(el)}el.innerHTML=loginHTML(msg,err)}
function hideLogin(){document.getElementById("fbLogin")?.remove()}
const fbErr=e=>({"auth/invalid-credential":"Špatný e-mail nebo heslo.","auth/wrong-password":"Špatné heslo.","auth/user-not-found":"Účet s tímto e-mailem neexistuje.","auth/email-already-in-use":"Účet s tímto e-mailem už existuje – přihlas se.","auth/weak-password":"Heslo musí mít aspoň 6 znaků.","auth/invalid-email":"Neplatný e-mail.","auth/popup-closed-by-user":"Přihlášení bylo zavřeno."})[e?.code]||("Chyba: "+(e?.message||e));
Object.assign(A,{
  fbGoogle:async()=>{try{await WEB.auth.signInWithPopup(new firebase.auth.GoogleAuthProvider())}catch(e){showLogin("",fbErr(e))}},
  fbLogin:async()=>{const m=document.getElementById("fbMail").value.trim(),p=document.getElementById("fbPass").value;try{await WEB.auth.signInWithEmailAndPassword(m,p)}catch(e){showLogin("",fbErr(e))}},
  fbRegister:async()=>{const m=document.getElementById("fbMail").value.trim(),p=document.getElementById("fbPass").value;try{const r=await WEB.auth.createUserWithEmailAndPassword(m,p);try{await r.user.sendEmailVerification()}catch(e){}toast("Účet vytvořen – na e-mail ti přišel odkaz k ověření.")}catch(e){showLogin("",fbErr(e))}},
  fbReset:async()=>{const m=document.getElementById("fbMail").value.trim();if(!m){showLogin("","Napiš e-mail, na který máš účet.");return}try{await WEB.auth.sendPasswordResetEmail(m);showLogin("Odkaz na nové heslo jsme poslali na "+m)}catch(e){showLogin("",fbErr(e))}},
  fbOffline:()=>{hideLogin();setStatus("local","Jen v tomto prohlížeči (nepřihlášen)")},
  fbLogout:async()=>{if(!confirm("Odhlásit se? Postavy zůstanou uložené ve tvém účtu."))return;await WEB.auth.signOut();try{localStorage.removeItem(LKEY);localStorage.removeItem(LKEY+"-uid")}catch(e){}location.reload()}});
function webBoot(){
  if(!WEB.on){setStatus("local","Uloženo v tomto prohlížeči (Firebase není nastavený)");return}
  firebase.initializeApp(FIREBASE_CONFIG);WEB.auth=firebase.auth();WEB.fs=firebase.firestore();
  try{WEB.fs.enablePersistence({synchronizeTabs:true}).catch(()=>{})}catch(e){}
  setStatus("busy","Přihlašuji…");
  WEB.auth.onAuthStateChanged(async u=>{
    if(!u){showLogin();setStatus("local","Nepřihlášen");return}
    hideLogin();WEB.user=u;
    // jiný účet na stejném počítači → začni s čistou místní pamětí
    let prev=null;try{prev=localStorage.getItem(LKEY+"-uid")}catch(e){}
    if(prev&&prev!==u.uid){try{localStorage.removeItem(LKEY)}catch(e){}initState()}
    try{localStorage.setItem(LKEY+"-uid",u.uid)}catch(e){}
    window.claude={use:async n=>n==="db"?fbAdapter():n==="user"?fbUser(u):null};
    await initCloud();addLogout(u);render();addVerifyBar(u)})}
function addVerifyBar(u){document.getElementById("fbVerify")?.remove();const isSTmail=!!u.email&&u.email.toLowerCase()===STORYTELLER_EMAIL.toLowerCase();
  if(!isSTmail||u.emailVerified||u.providerData.some(p=>p.providerId==="google.com"))return;
  const bar=document.createElement("div");bar.id="fbVerify";bar.className="note";bar.style.cssText="margin:0 0 14px;border-left:3px solid var(--blood)";
  bar.innerHTML=`<b>Záložka Vypravěč se objeví po ověření e-mailu ${esc(u.email)}.</b> Ověřovací odkaz přichází z adresy <i>noreply@kronika-krve.firebaseapp.com</i> – zkontroluj i složku Spam / Hromadné. <span class="inline" style="margin-top:6px;gap:8px"><button class="btn sm" data-act="fbResend">Poslat ověřovací e-mail znovu</button><button class="btn sm pri" data-act="fbVerified">Už jsem ověřil – obnovit</button></span>`;
  const v=document.getElementById("view");v.parentNode.insertBefore(bar,v)}
Object.assign(A,{
  fbResend:async()=>{try{await WEB.user.sendEmailVerification();toast("Ověřovací e-mail odeslán na "+WEB.user.email)}catch(e){toast(e?.code==="auth/too-many-requests"?"Příliš mnoho pokusů – zkus to za pár minut.":fbErr(e))}},
  fbVerified:async()=>{try{await WEB.user.reload();await WEB.user.getIdToken(true)}catch(e){}if(WEB.user.emailVerified){toast("Ověřeno – načítám znovu…");setTimeout(()=>location.reload(),600)}else toast("E-mail zatím ověřený není – klikni na odkaz v e-mailu.")}});
function addLogout(u){if(document.getElementById("fbOut"))return;const st=document.getElementById("status");if(!st)return;const b=document.createElement("button");b.id="fbOut";b.className="btn sm ghost";b.dataset.act="fbLogout";b.title=u.email||"";b.textContent="Odhlásit ("+(u.displayName||u.email||"účet")+")";st.parentNode.insertBefore(b,st.nextSibling)}

initState();render();webBoot();
